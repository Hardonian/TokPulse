name: Unified Dependency Upgrade

on:
  schedule:
    # Runs every Monday at 05:00 UTC
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      auto_merge:
        description: 'Auto-merge if CI passes'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-dependencies:
    name: Consolidate & Bump All Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8.15.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Run Safe Dependency Upgrade
        run: node scripts/bump-deps.mjs

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): consolidate and upgrade all dependencies to latest'
          title: 'chore(deps): Safe Unified Dependency Upgrade (Consolidated)'
          body: |
            ## 📦 Unified Safe Dependency Upgrade
            
            This automated PR consolidates all pending dependency upgrades into a single, tested update to prevent Dependabot PR noise.

            ### ✅ Automated Quality Gates Passed:
            - Strict TypeScript Compilation (`pnpm typecheck`)
            - Lint & Style Formatting
            - Vitest Unit Test Suite

            Auto-generated by `.github/workflows/unified-dependency-bump.yml`.
          branch: chore/bump-all-dependencies
          base: main
          delete-branch: true
          labels: |
            dependencies
            automated-pr
            safe-bump
